<section id="education" class="section" aria-labelledby="education-title">
  <div class="section__header">
    <h2 id="education-title">{{ content().education.title }}</h2>
  </div>
  <div class="grid-list">
    @for (item of content().education.items; track item.id) {
      <article class="info-block education-card">
        <span
          class="education-card__logo"
          [class.education-card__logo--full-cycle]="item.id === 'full-cycle'"
          [class.education-card__logo--estacio]="item.id === 'estacio'"
        >
          <img
            [src]="item.logoSrc"
            width="300"
            height="300"
            [alt]="item.logoAlt"
            loading="lazy"
            decoding="async"
          />
          @if (item.id === 'estacio') {
            <span class="education-card__wordmark" aria-hidden="true">Estácio</span>
          }
        </span>
        <div>
          <h3>
            @if (item.url) {
              <a [href]="item.url" rel="noopener noreferrer" target="_blank">
                {{ item.title }}
              </a>
            } @else {
              {{ item.title }}
            }
          </h3>
          @if (item.institution) {
            <p>{{ item.institution }}</p>
          }
          <p>{{ item.statusOrYear }}</p>
        </div>
      </article>
    }
  </div>
</section>

<ng-content />
<app-courses-section />
<app-languages-section />
